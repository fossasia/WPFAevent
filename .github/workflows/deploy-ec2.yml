name: Deploy Plugin to EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-ec2-production
  # Do not interrupt a deployment while files or Composer dependencies may be
  # changing on the server. A queued run will deploy the newer commit next.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    env:
      PLUGIN_PATH: ${{ vars.EC2_PLUGIN_PATH }}
      DEPLOY_BRANCH: ${{ vars.EC2_DEPLOY_BRANCH || 'main' }}

    steps:
      - name: Validate deployment configuration
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          for name in EC2_HOST EC2_USER EC2_SSH_KEY PLUGIN_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "Required production setting $name is missing."
              exit 1
            fi
          done

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_USER: ${{ vars.EC2_USER }}
          EC2_PORT: ${{ vars.EC2_PORT || '22' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail

          if ! [[ "$EC2_PORT" =~ ^[0-9]+$ ]] || (( 10#$EC2_PORT < 1 || 10#$EC2_PORT > 65535 )); then
            echo "EC2_PORT must be a number between 1 and 65535."
            exit 1
          fi
          EC2_PORT=$((10#$EC2_PORT))

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          PLUGIN_PATH_B64=$(printf '%s' "$PLUGIN_PATH" | base64 --wrap=0)
          DEPLOY_BRANCH_B64=$(printf '%s' "$DEPLOY_BRANCH" | base64 --wrap=0)

          HOST_KEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILdNcDk+KwyrSlAOGF1P39S+2JqJqCfJccU/AMAUVbQX'

          if [ "$EC2_PORT" = "22" ]; then
            printf '%s %s\n' "$EC2_HOST" "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          else
            printf '[%s]:%s %s\n' "$EC2_HOST" "$EC2_PORT" "$HOST_KEY" > "$HOME/.ssh/known_hosts"
          fi

          chmod 600 "$HOME/.ssh/known_hosts"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -p "$EC2_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$EC2_USER@$EC2_HOST" \
            "PLUGIN_PATH_B64='$PLUGIN_PATH_B64' DEPLOY_BRANCH_B64='$DEPLOY_BRANCH_B64' bash -s" <<'REMOTE'

          set -eu

          PLUGIN_PATH=$(printf '%s' "$PLUGIN_PATH_B64" | base64 --decode)
          DEPLOY_BRANCH=$(printf '%s' "$DEPLOY_BRANCH_B64" | base64 --decode)

          echo "Checking deployment directory..."

          if [ ! -d "$PLUGIN_PATH" ]; then
            echo "ERROR: Plugin directory does not exist."
            exit 1
          fi

          if [ ! -d "$PLUGIN_PATH/.git" ]; then
            echo "ERROR: Git repository not found."
            exit 1
          fi

          if ! command -v composer >/dev/null 2>&1; then
            echo "ERROR: Composer is not installed."
            exit 1
          fi

          cd "$PLUGIN_PATH"

          echo "Checking working tree..."

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Working tree is dirty. Aborting deployment."
            git status --short
            exit 1
          fi

          echo "Fetching latest code..."

          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"
          git reset --hard "origin/$DEPLOY_BRANCH"

          echo "Installing production dependencies..."

          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction

          echo "Flushing WordPress cache..."

          if command -v wp >/dev/null 2>&1; then
            wp cache flush
          else
            echo "WP-CLI not found. Skipping cache flush."
          fi

          echo "Deployment completed successfully."

          REMOTE
